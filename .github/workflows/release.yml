name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: false
        type: string
      dry_run:
        description: 'Build and test only; skip publishing and release creation'
        required: false
        type: boolean
        default: false

jobs:
  check-inputs:
    runs-on: ubuntu-latest

    steps:
    - name: Validate workflow inputs
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
          && [ "${{ inputs.dry_run }}" != "true" ] \
          && [ -z "${{ inputs.version }}" ]; then
          echo "::error::version is required when dry_run is false"
          exit 1
        fi

  ci:
    needs: check-inputs
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release Binaries
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive-ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive-ext: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build ArgumentCompleter (NativeAOT)
        run: dotnet publish src/PSCue.ArgumentCompleter/PSCue.ArgumentCompleter.csproj -c Release -r ${{ matrix.rid }} -p:DebugType=none -o dist/${{ matrix.rid }}/

      - name: Build Module
        run: dotnet publish src/PSCue.Module/PSCue.Module.csproj -c Release -r ${{ matrix.rid }} -p:DebugType=none -o dist/${{ matrix.rid }}/

      - name: Copy module files
        shell: pwsh
        run: |
          Copy-Item module/PSCue.psd1 dist/${{ matrix.rid }}/
          Copy-Item module/PSCue.psm1 dist/${{ matrix.rid }}/
          Copy-Item module/Functions.ps1 dist/${{ matrix.rid }}/
          Copy-Item LICENSE dist/${{ matrix.rid }}/
          Copy-Item README.md dist/${{ matrix.rid }}/

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/${{ matrix.rid }}/* -DestinationPath PSCue-${{ matrix.rid }}.zip

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist/${{ matrix.rid }}
          tar -czf ../../PSCue-${{ matrix.rid }}.tar.gz *

      - name: Generate checksum
        shell: pwsh
        run: |
          $archive = if ('${{ matrix.archive-ext }}' -eq 'zip') {
            "PSCue-${{ matrix.rid }}.zip"
          } else {
            "PSCue-${{ matrix.rid }}.tar.gz"
          }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          "$hash  $archive" | Out-File -FilePath checksums-${{ matrix.rid }}.txt -Encoding utf8

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PSCue-${{ matrix.rid }}
          path: |
            PSCue-${{ matrix.rid }}.*
            checksums-${{ matrix.rid }}.txt

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      - name: Combine checksums
        run: |
          cat artifacts/*/checksums-*.txt > checksums.txt

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PSCue ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/PSCue-win-x64/PSCue-win-x64.zip
            artifacts/PSCue-linux-x64/PSCue-linux-x64.tar.gz
            checksums.txt
